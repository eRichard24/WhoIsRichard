<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詹鈞淵 Richard Chan — 保險科技策略與交付顧問</title>
<meta name="description" content="25 年保險 IT 策略、系統整合與交付管理經驗，服務兩岸三地 20 餘家保險與金融機構">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06162d;
  --ink-2:#1d222d;
  --gold:#c9a227;
  --gold-soft:#e8d9a8;
  --paper:#ffffff;
  --mist:#f4f4f2;
  --line:#dcd8cd;
  --grey:#6b7280;
  --serif:'Cormorant Garamond','Noto Serif TC','Noto Serif SC',serif;
  --sans:'Inter','Noto Sans TC','Noto Sans SC',sans-serif;
  --ease-dir:cubic-bezier(0.77,0,0.175,1);
  --ease-circ:cubic-bezier(0.075,0.82,0.165,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--ink);color:var(--gold-soft)}
.tnum{font-feature-settings:"tnum" 1,"lnum" 1}
a{color:inherit;text-decoration:none}

/* ---------- 3×3 square markers ---------- */
.sq9{display:grid;grid-template-columns:repeat(3,5px);grid-template-rows:repeat(3,5px);gap:4px;width:23px}
.sq9 i{background:var(--gold);display:block}
.sq9.ink i{background:var(--ink)}
.sq9.rev i{background:var(--paper)}

/* ---------- header ---------- */
#hd{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 4vw;background:var(--paper);
  border-bottom:1px solid var(--line);
}
#hd.out{animation:hdOut .2s var(--ease-circ) both}
#hd.in{animation:hdIn .4s var(--ease-circ) both}
@keyframes hdIn{0%{transform:translateY(-100%)}100%{transform:translateY(0)}}
@keyframes hdOut{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
#hd .brand{display:flex;align-items:center;gap:14px}
#hd .brand .nm{display:flex;flex-direction:column;line-height:1.1}
#hd .brand .zh{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:.03em}
#hd .brand .en-name{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;margin-top:4px}
#hd .brand::before{content:"";width:9px;height:9px;background:var(--gold);align-self:center;margin-right:2px}
html[lang="en"] #hd .brand [data-i18n="brand_zh"]{display:none}
#hd nav{display:flex;gap:30px}
#hd nav a{
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;
  position:relative;padding:4px 0;transition:color .25s;
}
#hd nav a::after{
  content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--gold);transition:width .3s var(--ease-circ);
}
#hd nav a:hover{color:var(--gold)}
#hd nav a:hover::after{width:100%}
#hd .hd-right{display:flex;align-items:center;gap:26px}
.lang{display:flex;align-items:center;gap:10px}
.lang button{
  background:none;border:none;cursor:pointer;font-family:var(--sans);font-weight:600;
  font-size:11px;letter-spacing:.12em;color:var(--grey);padding:4px 1px;border-bottom:1px solid transparent;
  transition:color .25s,border-color .25s;
}
.lang button:hover{color:var(--ink)}
.lang button.act{color:var(--gold);border-bottom-color:var(--gold)}
.lang i{color:var(--line);font-style:normal;font-size:11px}
#hd .cta{
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;
  border:1px solid var(--ink);padding:9px 20px;transition:border-width .12s;
}
#hd .cta:hover{border-width:2px}
@media(max-width:1100px){#hd nav{display:none}}
@media(max-width:640px){#hd .cta{display:none}}

/* ---------- progress bar ---------- */
#prog{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;z-index:70}

/* ---------- hero ---------- */
#hero{
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:140px 4vw 80px;position:relative;overflow:hidden;
}
#hero .meta-row{
  display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--grey);
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6vh;
}
#hero .meta-row b{color:var(--ink);font-weight:600}
#hero h1{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(38px,6.2vw,96px);line-height:1.18;letter-spacing:-.01em;
  max-width:20ch;
}
#hero h1 .gold{color:var(--gold);font-weight:600}
html[lang="en"] #hero h1{font-size:clamp(30px,4vw,62px);max-width:26ch;line-height:1.22}
#hero .sub{
  margin-top:5vh;display:flex;gap:6vw;flex-wrap:wrap;align-items:flex-start;
}
.hero-main{display:flex;gap:5vw;align-items:flex-start}
.hero-main .hero-text{flex:1.15;min-width:0}
#hero .sub p{max-width:44ch;font-size:15px;color:var(--ink-2)}
#hero .sub .role{
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:var(--gold);
  border-left:2px solid var(--gold);padding-left:14px;line-height:2;
}
.hero-pic{flex:0 1 400px;margin-top:1.5vh}
.hero-pic img{width:100%;display:block;border:1px solid var(--gold)}
.hero-pic figcaption{font-size:11px;color:var(--grey);letter-spacing:.14em;margin-top:12px;line-height:1.9}
.hero-pic figcaption b{color:var(--gold);font-weight:600}
@media(max-width:960px){.hero-main{flex-direction:column}.hero-pic{max-width:420px}}
#hero .scroll-hint{
  position:absolute;bottom:34px;left:4vw;display:flex;align-items:center;gap:12px;
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);
}
#hero .scroll-hint .bar{width:1px;height:44px;background:var(--line);position:relative;overflow:hidden}
#hero .scroll-hint .bar::after{
  content:"";position:absolute;left:0;top:-100%;width:100%;height:100%;background:var(--gold);
  animation:drip 1.8s var(--ease-circ) infinite;
}
@keyframes drip{0%{top:-100%}60%,100%{top:100%}}
#hero .hero-num{
  position:absolute;right:4vw;bottom:30px;text-align:right;
  font-family:var(--serif);color:var(--gold);
}
#hero .hero-num .n{font-size:clamp(60px,8vw,120px);font-weight:600;line-height:1}
#hero .hero-num .l{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);font-family:var(--sans)}

/* ---------- section scaffolding ---------- */
section{padding:11vh 4vw;position:relative}
.sec-head{display:flex;align-items:center;gap:26px;margin-bottom:7vh}
.sec-head .no{font-family:var(--serif);font-size:15px;color:var(--gold);letter-spacing:.1em}
.sec-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(30px,3.6vw,54px);letter-spacing:-.01em}
.sec-head .rule{flex:1;height:1px;background:var(--line)}

/* reveal */
.rv{opacity:0;transform:translateX(1rem)}
.rv.on{animation:rvIn .8s var(--ease-dir) both}
@keyframes rvIn{0%{opacity:0;transform:translateX(1rem)}100%{opacity:1;transform:translateX(0)}}

/* ---------- stats / 業務規模 ---------- */
#scale{background:var(--ink);color:var(--paper)}
#scale .sec-head h2{color:var(--paper)}
#scale .sec-head .rule{background:rgba(255,255,255,.18)}
#scale .lede{max-width:62ch;color:#b9c3d4;font-size:15px;margin-bottom:6vh}
#scale .lede b{color:var(--gold-soft);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.14)}
@media(max-width:960px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.stats{grid-template-columns:1fr}}
.stat{background:var(--ink);padding:44px 34px;position:relative;transition:background .35s}
.stat:hover{background:#0a2144}
.stat .k{font-family:var(--serif);font-weight:600;font-size:clamp(44px,4.6vw,72px);line-height:1;color:var(--gold);font-feature-settings:"tnum" 1}
.stat .k small{font-size:.42em;font-weight:500;margin-left:2px}
.stat .t{margin-top:16px;font-size:15px;font-weight:600;letter-spacing:.04em}
.stat .d{margin-top:8px;font-size:12.5px;color:#93a1b8;line-height:1.7}
.stat::after{content:"";position:absolute;left:34px;bottom:0;height:2px;width:0;background:var(--gold);transition:width .5s var(--ease-circ)}
.stat:hover::after{width:calc(100% - 68px)}
.scale-strip{margin-top:6vh;display:flex;gap:0;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.14)}
.scale-strip .cell{flex:1 1 220px;padding:26px 30px;border-right:1px solid rgba(255,255,255,.14)}
.scale-strip .cell:last-child{border-right:none}
.scale-strip .l{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#8b98ad}
.scale-strip .v{font-family:var(--serif);font-size:24px;margin-top:8px;color:var(--paper)}
.scale-strip .v em{font-style:normal;color:var(--gold)}

/* ---------- cases 重點案例 ---------- */
.case{
  border-top:1px solid var(--line);
  padding:44px 0 0;position:relative;cursor:pointer;
}
.case:last-of-type{border-bottom:1px solid var(--line)}
.case .row{display:grid;grid-template-columns:70px 1.1fr 1.6fr 40px;gap:3vw;align-items:baseline}
@media(max-width:960px){.case .row{grid-template-columns:44px 1fr 34px}.case .row .where{display:none}}
.case .idx{font-family:var(--serif);color:var(--gold);font-size:18px}
.case h3{font-family:var(--serif);font-weight:600;font-size:clamp(30px,3.4vw,52px);letter-spacing:-.01em;transition:color .3s}
.case:hover h3{color:var(--gold)}
.case .where{font-size:13px;color:var(--grey);line-height:1.9}
.case .where b{color:var(--ink);font-weight:600;display:block;font-size:14px}
.case .pm{
  font-family:var(--serif);font-size:34px;color:var(--gold);justify-self:end;
  transition:transform .4s var(--ease-circ);line-height:1;
}
.case.open .pm{transform:rotate(45deg)}
.case .body{
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .65s var(--ease-circ),opacity .45s .05s;
}
.case.open .body{max-height:1100px;opacity:1}
.case .body-in{padding:34px 0 50px  calc(70px + 3vw)}
@media(max-width:960px){.case .body-in{padding-left:calc(44px + 3vw)}}
.cmetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);max-width:880px}
@media(max-width:720px){.cmetrics{grid-template-columns:1fr}}
.cmetrics .m{background:var(--paper);padding:22px 26px}
.cmetrics .m .k{font-family:var(--serif);font-weight:600;font-size:32px;color:var(--gold);font-feature-settings:"tnum" 1;line-height:1.1}
.cmetrics .m .t{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);margin-top:8px}
.case .bullets{margin-top:34px;max-width:880px;list-style:none}
.case .bullets li{
  font-size:14px;color:var(--ink-2);line-height:1.8;padding:10px 0 10px 24px;position:relative;
  border-bottom:1px dashed var(--line);
}
.case .bullets li::before{content:"";position:absolute;left:2px;top:20px;width:8px;height:8px;background:var(--gold)}
.case .clabel{margin-top:34px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:600}
.case .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;max-width:980px}
.case .chips span{
  font-size:12.5px;padding:8px 16px;border:1px solid var(--line);color:var(--ink-2);
  transition:border-color .3s,color .3s,background .3s;
}
.case .chips span:hover{border-color:var(--gold);color:#8a6d14;background:#fcf9ef}
.case .chips span i{font-style:normal;color:var(--gold);margin-left:8px;font-size:11px}

/* ---------- clients ---------- */
#clients{background:var(--paper)}
.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0;margin-bottom:7vh;user-select:none}
.marquee .track{display:flex;gap:64px;width:max-content;animation:mq 46s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.marquee .track span{font-family:var(--serif);font-size:26px;font-weight:500;white-space:nowrap;color:var(--ink);display:flex;align-items:center;gap:64px}
.marquee .track span::after{content:"";width:7px;height:7px;background:var(--gold);display:inline-block}
@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

.filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:5vh}
.chip{
  font-size:12px;letter-spacing:.12em;font-weight:500;padding:9px 20px;
  border:1px solid var(--ink);background:transparent;cursor:pointer;color:var(--ink);
  font-family:var(--sans);transition:border-width .12s,background .25s,color .25s;
}
.chip:hover{border-width:2px}
.chip.act{background:var(--ink);color:var(--gold-soft)}
.chip .n{color:var(--gold);margin-left:6px;font-feature-settings:"tnum" 1}
.chip.act .n{color:var(--gold-soft)}

.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
@media(max-width:1060px){.cgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.cgrid{grid-template-columns:1fr}}
.cc{background:var(--paper);padding:34px 30px 30px;position:relative;overflow:hidden;transition:background .35s}
.cc::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease-circ)}
.cc:hover::before{transform:scaleX(1)}
.cc:hover{background:#fcf9ef}
.cc .stage{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.cc h3{font-family:var(--serif);font-size:26px;font-weight:600;margin:10px 0 4px;letter-spacing:-.01em}
.cc .desc{font-size:13.5px;color:var(--ink-2);line-height:1.75;margin-top:12px;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s var(--ease-circ),opacity .4s .05s}
.cc:hover .desc{max-height:180px;opacity:1}
.cc .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.cc .tags i{font-style:normal;font-size:10.5px;letter-spacing:.1em;padding:4px 10px;border:1px solid var(--line);color:var(--grey);transition:border-color .3s,color .3s}
.cc:hover .tags i{border-color:var(--gold);color:#8a6d14}
.cc .yr{position:absolute;top:30px;right:26px;font-size:11px;color:var(--grey);font-feature-settings:"tnum" 1;letter-spacing:.08em}
.cc.hide{display:none}
.cfoot{margin-top:4vh;font-size:12px;color:var(--grey);letter-spacing:.06em}
.cfoot b{color:var(--gold);font-weight:600}

/* ---------- others 其他經歷 ---------- */
#others{background:var(--mist)}
.olist{border-top:1px solid var(--line)}
.orow{
  display:grid;grid-template-columns:220px 1fr 2fr;gap:3vw;align-items:baseline;
  padding:30px 0;border-bottom:1px solid var(--line);
}
@media(max-width:860px){.orow{grid-template-columns:1fr;gap:8px}}
.orow .y{font-size:12px;letter-spacing:.16em;color:var(--grey);font-feature-settings:"tnum" 1}
.orow .co{font-family:var(--serif);font-size:24px;font-weight:600}
.orow .co small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:600;margin-top:4px;text-transform:uppercase}
.orow p{font-size:13.5px;color:var(--ink-2);line-height:1.8;max-width:64ch}

/* ---------- expertise ---------- */
.exp{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
@media(max-width:860px){.exp{grid-template-columns:1fr}}
.ex{background:var(--paper);padding:40px 36px;transition:background .35s}
.ex:hover{background:#fcf9ef}
.ex .no{font-family:var(--serif);color:var(--gold);font-size:15px}
.ex h3{font-family:var(--serif);font-size:24px;font-weight:600;margin:12px 0 10px}
.ex p{font-size:13.5px;color:var(--ink-2);line-height:1.8}

/* ---------- footer ---------- */
footer{background:var(--ink);color:var(--paper);padding:10vh 4vw 6vh}
footer .big{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4.4vw,64px);line-height:1.25;max-width:22ch}
footer .big a{color:var(--gold);border-bottom:1px solid var(--gold);transition:opacity .25s}
footer .big a:hover{opacity:.7}
footer .cols{display:flex;flex-wrap:wrap;gap:5vw;margin-top:8vh;padding-top:5vh;border-top:1px solid rgba(255,255,255,.16)}
footer .cols .c .l{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#8b98ad}
footer .cols .c .v{margin-top:10px;font-size:14px;line-height:2}
footer .cols .c .v a:hover{color:var(--gold)}
footer .base{margin-top:8vh;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:11px;color:#8b98ad;letter-spacing:.14em}
.edu{margin-top:6vh;display:flex;flex-wrap:wrap;gap:3vw}
.edu .e{border:1px solid rgba(255,255,255,.2);padding:16px 22px}
.edu .e .l{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.edu .e .v{font-size:13px;margin-top:6px;color:#c9d2e0}

/* ---------- community ---------- */
.comm{display:flex;gap:4vw;margin-top:6vh;align-items:flex-start;flex-wrap:wrap}
.comm .talks{flex:1;min-width:300px;max-width:840px}
.comm .talks .tl-head{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:22px}
.comm .talk{padding:16px 0 16px 26px;border-left:2px solid var(--gold);position:relative}
.comm .talk + .talk{border-top:1px solid rgba(255,255,255,.12)}
.comm .talk::before{content:"";position:absolute;left:-6px;top:26px;width:10px;height:10px;background:var(--ink);border:2px solid var(--gold)}
.comm .talk h4{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--paper)}
.comm .talk p{font-size:12.5px;color:#93a1b8;margin-top:4px;letter-spacing:.04em}
</style>
</head>
<body>

<div id="prog"></div>

<header id="hd">
  <a class="brand" href="#hero"><span class="nm"><span class="zh" data-i18n="brand_zh">詹鈞淵</span><span class="en-name">Richard CHAN</span></span></a>
  <nav>
    <a href="#scale" data-i18n="nav_scale"></a>
    <a href="#cases" data-i18n="nav_cases"></a>
    <a href="#clients" data-i18n="nav_clients"></a>
    <a href="#others" data-i18n="nav_others"></a>
    <a href="#exp" data-i18n="nav_exp"></a>
  </nav>
  <div class="hd-right">
    <div class="lang" id="langSwitch">
      <button data-lang="zh-Hant">繁體</button><i>|</i>
      <button data-lang="zh-Hans">简体</button><i>|</i>
      <button data-lang="en">EN</button>
    </div>
    <a class="cta" href="#contact" data-i18n="nav_contact"></a>
  </div>
</header>

<!-- ================= HERO ================= -->
<section id="hero">
  <div class="meta-row rv">
    <span data-i18n="hero_meta1"></span>
    <span data-i18n="hero_meta2"></span>
    <span data-i18n="hero_meta3"></span>
  </div>
  <div class="hero-main">
    <div class="hero-text">
      <h1 class="rv" data-i18n="hero_h1"></h1>
      <div class="sub">
        <p class="rv" data-i18n="hero_sub"></p>
        <div class="role rv" data-i18n="hero_role"></div>
      </div>
    </div>
    <figure class="hero-pic rv">
      <img src="community-talk.png" data-i18n-alt="hero_pic_alt">
      <figcaption data-i18n="hero_cap"></figcaption>
    </figure>
  </div>
  <div class="scroll-hint"><span class="bar"></span><span data-i18n="hero_scroll"></span></div>
  <div class="hero-num tnum">
    <div class="n">25<span style="font-size:.45em">+</span></div>
    <div class="l" data-i18n="hero_num_l"></div>
  </div>
</section>

<!-- ================= SCALE ================= -->
<section id="scale">
  <div class="sec-head">

  {n:'MSIG Ming Tai', y:'2012–20', s:'ibm', t:['Digital Innovation'], d:'IT innovation initiative design and implementation, driving P&C digital innovation'},
  {n:'Fubon Life (Vietnam)', y:'2009–12', s:'other', t:['Core System'], d:'Core insurance system deployment, with cross-region support from Taiwan'},
  {n:'Nanshan Life', y:'2003–09', s:'other', t:['Core Transformation'], d:'Led core insurance system transformation from the client side; migrated IT services from Guangzhou to Taipei with a 10+ member team and zero business disruption'}]};

/* ================= LANG STATE ================= */
let LANG = new URLSearchParams(location.search).get('lang') || localStorage.getItem('rc-lang') || 'zh-Hant';
if(!TR[LANG]) LANG = 'zh-Hant';

/* ================= RENDER ================= */
function renderAll(){
  const t = TR[LANG];
  // static texts
  document.querySelectorAll('[data-i18n]').forEach(el=>{ const k = el.dataset.i18n; if(t[k]!==undefined) el.innerHTML = t[k]; });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll('[data-i18n-alt]').forEach(el=>{ el.alt = t[el.dataset.i18nAlt] || ''; });
  document.title = t.meta_title;
  document.documentElement.lang = LANG;

  // marquee
  const names = CLIENTS[LANG].map(c=>c.n);
  document.getElementById('mq').innerHTML = [...names,...names].map(n=>`<span>${n}</span>`).join('');

  // cases
  const caseWrap = document.getElementById('caseWrap');
  caseWrap.innerHTML = CASES[LANG].map((c,i)=>`
    <div class="case rv${i===0?' open':''}">
      <div class="row">
        <div class="idx">${c.idx}</div>
        <h3>${c.co}</h3>
        <div class="where"><b>${c.role}</b>${c.period} · ${c.loc}<br>${c.en}</div>
        <div class="pm">+</div>
      </div>
      <div class="body"><div class="body-in">
        <div class="cmetrics">${c.metrics.map(m=>`<div class="m"><div class="k tnum">${m[0]}</div><div class="t">${m[1]}</div></div>`).join('')}</div>
        <ul class="bullets">${c.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
        <div class="clabel">${t.cases_clients} · ${c.clients.length}</div>
        <div class="chips">${c.clients.map(x=>`<span>${x[0]}<i>${x[1]}</i></span>`).join('')}</div>
      </div></div>
    </div>`).join('');

  // filters
  const st = STAGES[LANG];
  const chips = [{key:'all',label:ALL_LABEL[LANG]}].concat(Object.entries(st).map(([k,v])=>({key:k,label:v})));
  document.getElementById('filters').innerHTML = chips.map((c,i)=>{
    const n = c.key==='all' ? CLIENTS[LANG].length : CLIENTS[LANG].filter(x=>x.s===c.key).length;
    return `<button class="chip${i===0?' act':''}" data-k="${c.key}">${c.label}<span class="n tnum">${n}</span></button>`;
  }).join('');

  // client grid
  const grid = document.getElementById('cgrid');
  grid.innerHTML = CLIENTS[LANG].map(c=>`
    <article class="cc rv" data-s="${c.s}">
      <div class="yr tnum">${c.y}</div>
      <div class="stage">${st[c.s]}</div>
      <h3>${c.n}</h3>
      <div class="tags">${c.t.map(x=>`<i>${x}</i>`).join('')}</div>
      <div class="desc">${c.d}</div>
    </article>`).join('');
  const ct = document.getElementById('ctotal'); if(ct) ct.textContent = CLIENTS[LANG].length;

  // others
  document.getElementById('otherList').innerHTML = OTHERS[LANG].map(o=>`
    <div class="orow rv">
      <div class="y tnum">${o[0]}</div>
      <div class="co">${o[1]}<small>${o[2]}</small></div>
      <p>${o[3]}</p>
    </div>`).join('');

  // expertise
  document.getElementById('expGrid').innerHTML = EXPS[LANG].map(e=>`
    <div class="ex rv"><div class="no">${e[0]}</div><h3>${e[1]}</h3><p>${e[2]}</p></div>`).join('');

  // talks
  document.getElementById('talkList').innerHTML =
    `<div class="tl-head">${t.comm_head}</div>` +
    TALKS[LANG].map(x=>`<div class="talk"><h4>${x[0]}</h4><p>${x[1]}</p></div>`).join('');

  // reveal observer for newly rendered .rv
  document.querySelectorAll('.rv:not(.on)').forEach(el=>io.observe(el));

  // lang switch active state
  document.querySelectorAll('#langSwitch button').forEach(b=>{
    b.classList.toggle('act', b.dataset.lang===LANG);
  });
}

/* ================= EVENTS ================= */
// case accordion
document.getElementById('caseWrap').addEventListener('click', e=>{
  const cs = e.target.closest('.case'); if(!cs) return;
  const wasOpen = cs.classList.contains('open');
  document.querySelectorAll('#caseWrap .case').forEach(x=>x.classList.remove('open'));
  if(!wasOpen) cs.classList.add('open');
});

// filters
document.getElementById('filters').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  document.querySelectorAll('#filters .chip').forEach(x=>x.classList.remove('act'));
  b.classList.add('act');
  const k = b.dataset.k;
  document.querySelectorAll('#cgrid .cc').forEach(card=>{
    const show = k==='all' || card.dataset.s===k;
    card.classList.toggle('hide', !show);
    if(show){ card.classList.remove('on'); void card.offsetWidth; card.classList.add('on'); }
  });
});

// lang switch
document.getElementById('langSwitch').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.lang === LANG) return;
  LANG = b.dataset.lang;
  localStorage.setItem('rc-lang', LANG);
  renderAll();
});

/* ================= SCROLL FX ================= */
let lastY = 0;
const hd = document.getElementById('hd');
window.addEventListener('scroll', ()=>{
  const y = window.scrollY;
  if(y > lastY && y > 300){ hd.classList.add('out'); hd.classList.remove('in'); }
  else { hd.classList.remove('out'); if(y>0) hd.classList.add('in'); }
  lastY = y;
  const h = document.documentElement;
  document.getElementById('prog').style.width = (y/(h.scrollHeight-h.clientHeight)*100)+'%';
},{passive:true});

const io = new IntersectionObserver(es=>{
  es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('on'); io.unobserve(en.target); } });
},{threshold:.15});

const cio = new IntersectionObserver(es=>{
  es.forEach(en=>{
    if(!en.isIntersecting) return;
    cio.unobserve(en.target);
    const el = en.target, to = +el.dataset.to, t0 = performance.now(), dur = 1600;
    const tick = now=>{
      const p = Math.min((now-t0)/dur,1), e = 1-Math.pow(1-p,3);
      el.textContent = Math.round(to*e);
      if(p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
},{threshold:.5});
document.querySelectorAll('.stat .cnt').forEach(el=>cio.observe(el));

renderAll();
</script>
</body>
</html>
